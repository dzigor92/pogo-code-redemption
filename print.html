<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printable Pokémon GO Codes</title>
  <link rel="stylesheet" href="css/print.css">
  <link rel="icon" type="image/png" href="img/infernaljelly-favicon.png">
</head>
<body>
  <header>
    <h1>Pokémon GO Codes – Printable Sheet</h1>
    <div class="actions">
      <button type="button" id="markAction" class="secondary" hidden>Mark all as handed out</button>
      <button type="button" id="printAction">Print</button>
    </div>
  </header>

  <div id="message" class="notice" hidden></div>

  <section id="sheet" class="sheet" aria-live="polite"></section>

  <script src="js/qrcode.min.js" defer></script>
  <script src="js/shared.js" defer></script>
  <script src="js/print.js" defer></script>
</body>
</html>
